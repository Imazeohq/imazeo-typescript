# Publishes @imazeo/sdk to npm with provenance via Trusted Publisher (OIDC).
#
# Local release (PowerShell):
#   $env:RELEASE_MODE="true"; npm run release -- --patch
#   $env:RELEASE_MODE="true"; npm run release -- --patch --github-release
#
# That bumps package.json + src/version.ts, commits, tags vX.Y.Z, and pushes.
# This workflow then runs `npm run release` in Actions → npm publish --provenance.
#
# GitHub-only options:
# A) Push an annotated tag vX.Y.Z whose package.json version matches
# B) GitHub → Releases → Draft a new release from tag vX.Y.Z (creates/pushes tag)
# C) Actions → Publish npm → Run workflow (optional tag input)
#
# One-time auth (preferred):
#   npmjs.com → @imazeo/sdk → Settings → Trusted Publisher → GitHub Actions
#     Repository owner: Imazeohq
#     Repository name:  imazeo-typescript
#     Workflow filename: publish.yml
#     Environment: (leave empty)

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish (e.g. v1.0.1). Leave empty to use the default branch tip (only if that version is not yet on npm).'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref }}

      - name: Verify release metadata
        run: python3 scripts/check-release.py
        env:
          GITHUB_REF_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && 'tag' || github.ref_type }}
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm (OIDC / provenance)
        run: npm run release
